[package]
name = "bt-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "app"          # radify runs dist/bin/app
path = "src/main.rs"

[[bin]]
name = "bt"           # dev/ops CLI: build-index, quantize, search, bench
path = "src/bin/bt.rs"

[features]
default = ["model"]
model = ["bt-core/model"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bt-core = { path = "../core", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
