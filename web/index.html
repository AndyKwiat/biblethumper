<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Thumper</title>
  <meta name="description" content="Search and read the Gospels (KJV) with plain-English notes beside every passage.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="Bible Thumper home"><span class="logo-mark">👍</span><span>Bible<b>Thumper</b></span></a>
    <form class="searchbox" id="search-form" role="search">
      <input id="q" type="search" autocomplete="off" placeholder="Search words, ideas or “John 3:16”…" aria-label="Search the Gospels">
      <button type="submit" aria-label="Search">🔎</button>
    </form>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer class="foot">King James Version (public domain) · plain-English notes are AI-written summaries, not scripture · <span id="engine"></span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
