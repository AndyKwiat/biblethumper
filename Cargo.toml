[workspace]
resolver = "2"
members = ["crates/core", "crates/server"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Candle's math kernels are unusably slow unoptimised; keep tests/dev fast.
[profile.dev.package."*"]
opt-level = 3
[profile.test.package."*"]
opt-level = 3
